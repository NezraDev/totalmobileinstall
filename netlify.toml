[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# The build already emits one HTML file for each route. Keep the site's
# canonical slashless URLs and our explicit redirect rules in control.
[build.processing.html]
  pretty_urls = false
