services:
  - type: web
    name: tmi-contact-email
    runtime: node
    buildCommand: node --version
    startCommand: node server/contact.mjs
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Total Mobile Install <amartin@totalmobileglass.com>"
      - key: ALLOWED_ORIGINS
        value: https://total-mobile-install-2026.nuttypika64.chatgpt.site
